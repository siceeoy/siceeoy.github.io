<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的作品集</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #ffffff;
      font-family: 'Arial Black', Arial, sans-serif;
      overflow-x: hidden;
    }

    header {
      text-align: center;
      padding: 60px 20px 20px;
    }

    header h1 {
      font-size: 3rem;
      font-weight: 900;
      color: #00ff88;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    header p {
      font-size: 0.9rem;
      color: #aaa;
      margin-top: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .section-title {
      text-align: center;
      padding: 80px 20px 0;
      font-size: 1rem;
      font-weight: 900;
      letter-spacing: 6px;
      color: #00ff88;
      text-transform: uppercase;
    }

    .parallax-wrap {
      position: relative;
      min-height: 700px;
      margin-bottom: 80px;
    }

    .category-label {
      font-size: 0.75rem;
      font-weight: 700;
      color: #00ff88;
      letter-spacing: 2px;
      text-transform: uppercase;
      position: absolute;
    }

    .work-item {
      position: absolute;
      overflow: hidden;
      box-shadow: 2px 4px 20px rgba(0,0,0,0.1);
    }

    .work-item:hover {
      z-index: 99;
      box-shadow: 4px 8px 30px rgba(0,255,136,0.3);
    }

    /* 占位色块，之后换成真实图片 */
    .placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: white;
    }

    footer {
      text-align: center;
      padding: 60px 20px;
      font-size: 0.75rem;
      color: #bbb;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>

  <header>
    <h1>SICE</h1>
    <p>字体设计 · 海报设计 · Logo设计 · 摄影</p >
  </header>

  <!-- 字体设计 -->
  <p class="section-title">Typography</p >
  <div class="parallax-wrap">
    <span class="category-label" style="top:30px; left:40px;">字体设计</span>

    <div class="work-item" style="width:280px;height:200px;top:80px;left:60px;transform:rotate(-3deg);">
      <div class="placeholder" style="background:#1a1a1a;">TYPOGRAPHY 01</div>
    </div>
    <div class="work-item" style="width:200px;height:260px;top:60px;left:380px;transform:rotate(2deg);">
      <div class="placeholder" style="background:#222;">TYPOGRAPHY 02</div>
    </div>
    <div class="work-item" style="width:240px;height:180px;top:300px;left:200px;transform:rotate(-1deg);">
      <div class="placeholder" style="background:#2a2a2a;">TYPOGRAPHY 03</div>
    </div>
  </div>

  <!-- 海报设计 -->
  <p class="section-title">Poster Design</p >
  <div class="parallax-wrap">
    <span class="category-label" style="top:30px; left:40px;">海报设计</span>

    <div class="work-item" style="width:220px;height:300px;top:70px;left:100px;transform:rotate(2deg);">
      <div class="placeholder" style="background:#111;">POSTER 01</div>
    </div>
    <div class="work-item" style="width:280px;height:200px;top:100px;left:360px;transform:rotate(-2deg);">
      <div class="placeholder" style="background:#1c1c1c;">POSTER 02</div>
    </div>
    <div class="work-item" style="width:180px;height:240px;top:330px;left:230px;transform:rotate(1deg);">
      <div class="placeholder" style="background:#252525;">POSTER 03</div>
    </div>
  </div>

  <!-- Logo设计 -->
  <p class="section-title">Logo Design</p >
  <div class="parallax-wrap">
    <span class="category-label" style="top:30px; left:40px;">Logo 设计</span>

    <div class="work-item" style="width:240px;height:240px;top:80px;left:80px;transform:rotate(-2deg);">
      <div class="placeholder" style="background:#0a0a0a;">LOGO 01</div>
    </div>
    <div class="work-item" style="width:200px;height:200px;top:60px;left:350px;transform:rotate(3deg);">
      <div class="placeholder" style="background:#151515;">LOGO 02</div>
    </div>
    <div class="work-item" style="width:220px;height:180px;top:310px;left:200px;transform:rotate(-1deg);">
      <div class="placeholder" style="background:#1e1e1e;">LOGO 03</div>
    </div>
  </div>

  <!-- 摄影 -->
  <p class="section-title">Photography</p >
  <div class="parallax-wrap">
    <span class="category-label" style="top:30px; left:40px;">摄影</span>

    <div class="work-item" style="width:300px;height:200px;top:80px;left:40px;transform:rotate(-1deg);">
      <div class="placeholder" style="background:#0d0d0d;">PHOTO 01</div>
    </div>
    <div class="work-item" style="width:200px;height:280px;top:50px;left:370px;transform:rotate(2deg);">
      <div class="placeholder" style="background:#181818;">PHOTO 02</div>
    </div>
    <div class="work-item" style="width:250px;height:180px;top:320px;left:160px;transform:rotate(-2deg);">
      <div class="placeholder" style="background:#202020;">PHOTO 03</div>
    </div>
  </div>

  <footer>© 2026 SICE — ALL RIGHTS RESERVED</footer>

  <script>
    window.addEventListener('scroll', () => {
      const scrollY = window.scrollY;
      const baseRotates = ['-3deg','2deg','-1deg','2deg','-2deg','1deg','-2deg','3deg','-1deg','-1deg','2deg','-2deg'];
      document.querySelectorAll('.work-item').forEach((el, i) => {
        const speed = (i % 3 === 0) ? 0.08 : (i % 3 === 1) ? 0.12 : 0.05;
        const offset = scrollY * speed;
        const deg = baseRotates[i] || '0deg';
        el.style.transform = `translateY(${offset}px) rotate(${deg})`;
      });
    });
  </script>

</body>
</html>
